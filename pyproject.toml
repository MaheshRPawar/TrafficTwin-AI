[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "traffictwin-ai"
version = "0.1.0"
description = "AI-Powered Traffic Flow Optimization Digital Twin"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "venv",
    "TrafficTwin References",
    "dist",
    "build"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501", "UP036"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
addopts = "-v"
